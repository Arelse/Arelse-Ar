<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arelse Ar</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/></symbol>
  <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M8 18l-4-4 10-10 6 6-7 8z"/><path d="M12 9l6 6"/></symbol>
  <symbol id="i-line" viewBox="0 0 24 24"><path d="M5 19L19 5"/></symbol>
  <symbol id="i-rect" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/></symbol>
  <symbol id="i-ellipse" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></symbol>
  <symbol id="i-select" viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></symbol>
  <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="M21 16l-5-5-9 9"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l2-3h4l2 3"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/></symbol>
  <symbol id="i-studio" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="10" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="15.5" cy="10" r="1"/></symbol>
  <symbol id="i-gallery" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-trace" viewBox="0 0 24 24"><rect x="3" y="3" width="13" height="13" rx="2"/><rect x="8" y="8" width="13" height="13" rx="2" stroke-dasharray="3 2"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></symbol>
  <symbol id="i-flip" viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M8 8L3 12l5 4"/><path d="M16 8l5 4-5 4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</svg>

<!-- HOME -->
<section id="home" class="screen active">
  <div class="status-pad"></div>
  <header class="home-head">
    <div>
      <p class="muted" id="date"></p>
      <h1>Good day</h1>
    </div>
    <button class="avatar glass" data-go="themes" aria-label="Themes">AA</button>
  </header>

  <div class="scroll">
    <div class="widgets">
      <div class="widget glass wide">
        <p class="muted">Time</p>
        <div class="clock" id="clock">--:--</div>
      </div>
      <div class="widget glass">
        <p class="muted">Drawings</p>
        <div class="big" id="count">0</div>
      </div>
      <button class="widget glass accent" data-go="studio">
        <p>Quick sketch</p>
        <svg class="icon plus"><use href="#i-plus"/></svg>
      </button>
      <div class="widget glass wide">
        <p class="muted">Inspiration</p>
        <p class="quote" id="quote"></p>
      </div>
      <div class="widget glass wide" id="last-w" hidden>
        <p class="muted">Last drawing</p>
        <img id="last-img" class="thumb" alt="">
      </div>
    </div>

    <p class="section-title">Apps</p>
    <div class="apps">
      <button class="app" data-go="studio"><span class="app-icon"><svg class="icon"><use href="#i-studio"/></svg></span>Studio</button>
      <button class="app" data-go="gallery"><span class="app-icon"><svg class="icon"><use href="#i-gallery"/></svg></span>Gallery</button>
      <button class="app" data-action="photo"><span class="app-icon"><svg class="icon"><use href="#i-photo"/></svg></span>Photo</button>
      <button class="app" data-go="trace"><span class="app-icon"><svg class="icon"><use href="#i-trace"/></svg></span>Trace</button>
    </div>
  </div>

  <nav class="glass dock">
    <button data-go="home" class="on" aria-label="Home"><svg class="icon"><use href="#i-home"/></svg></button>
    <button data-go="studio" aria-label="Studio"><svg class="icon"><use href="#i-studio"/></svg></button>
    <button data-go="gallery" aria-label="Gallery"><svg class="icon"><use href="#i-gallery"/></svg></button>
  </nav>
</section>

<!-- STUDIO -->
<section id="studio" class="screen">
  <div id="stage" class="stage">
    <video id="cam" autoplay playsinline muted hidden></video>
    <canvas id="draw"></canvas>
  </div>

  <header class="glass top">
    <button class="ib" data-go="home" aria-label="Home"><svg class="icon"><use href="#i-back"/></svg></button>
    <div class="acts">
      <button class="ib" id="undo-btn" aria-label="Undo"><svg class="icon"><use href="#i-undo"/></svg></button>
      <button class="ib" id="redo-btn" aria-label="Redo"><svg class="icon"><use href="#i-redo"/></svg></button>
      <button class="ib" id="photo-btn" aria-label="Add photo"><svg class="icon"><use href="#i-photo"/></svg></button>
      <button class="ib" id="grid-btn" aria-label="Grid"><svg class="icon"><use href="#i-grid"/></svg></button>
      <button class="ib" id="cam-btn" aria-label="Camera"><svg class="icon"><use href="#i-camera"/></svg></button>
      <button class="ib" id="save-btn" aria-label="Save"><svg class="icon"><use href="#i-save"/></svg></button>
    </div>
  </header>

  <div class="glass lpanel">
    <div class="lchips" id="layers"></div>
    <button class="lbtn" id="layer-add" aria-label="Add layer"><svg class="icon"><use href="#i-plus"/></svg></button>
    <button class="lbtn" id="layer-dup" aria-label="Duplicate layer"><svg class="icon"><use href="#i-photo"/></svg></button>
    <button class="lbtn" id="layer-del" aria-label="Delete layer"><svg class="icon"><use href="#i-trash"/></svg></button>
  </div>

  <div class="glass props" id="props">
    <div class="bpills" id="brushes"></div>
    <div class="swatches" id="swatches"></div>
    <label class="sl">Size <input type="range" id="size" min="1" max="40" value="6"></label>
    <label class="sl">Opacity <input type="range" id="op" min="10" max="100" value="100"></label>
    <label class="sl">Layer
      <select id="blend" class="sel-blend">
        <option value="source-over">Normal</option>
        <option value="multiply">Multiply</option>
        <option value="screen">Screen</option>
        <option value="overlay">Overlay</option>
      </select>
      <input type="range" id="lop" min="0" max="100" value="100">
    </label>
    <button class="text-btn" id="clear-btn">Clear layer</button>
  </div>

  <div class="glass props" id="pic-props" hidden>
    <label class="sl">Size <input type="range" id="pic-scale" min="10" max="100" value="40"></label>
    <label class="sl">Opacity <input type="range" id="pic-op" min="10" max="100" value="100"></label>
    <button class="text-btn danger" id="pic-del"><svg class="icon"><use href="#i-trash"/></svg> Remove photo</button>
  </div>

  <nav class="glass toolbar">
    <button class="tool on" data-tool="brush" aria-label="Brush"><svg class="icon"><use href="#i-pen"/></svg></button>
    <button class="tool" data-tool="line" aria-label="Line"><svg class="icon"><use href="#i-line"/></svg></button>
    <button class="tool" data-tool="rect" aria-label="Rectangle"><svg class="icon"><use href="#i-rect"/></svg></button>
    <button class="tool" data-tool="ellipse" aria-label="Ellipse"><svg class="icon"><use href="#i-ellipse"/></svg></button>
    <button class="tool" data-tool="select" aria-label="Move photos"><svg class="icon"><use href="#i-select"/></svg></button>
  </nav>

  <input type="file" id="file" accept="image/*" hidden>
</section>

<!-- TRACE -->
<section id="trace" class="screen">
  <video id="t-cam" autoplay playsinline muted></video>
  <img id="t-ref" class="t-ref" alt="Reference to trace" hidden>
  <div id="t-empty" class="t-empty">
    <button class="pill" id="t-add"><svg class="icon"><use href="#i-photo"/></svg> Add a photo to trace</button>
  </div>
  <header class="glass top">
    <button class="ib" data-go="home" aria-label="Home"><svg class="icon"><use href="#i-back"/></svg></button>
    <span class="title">Trace</span>
    <div class="acts">
      <button class="ib" id="t-photo" aria-label="Choose photo"><svg class="icon"><use href="#i-photo"/></svg></button>
      <button class="ib" id="t-flip" aria-label="Flip"><svg class="icon"><use href="#i-flip"/></svg></button>
      <button class="ib" id="t-lock" aria-label="Lock photo"><svg class="icon"><use href="#i-lock"/></svg></button>
    </div>
  </header>
  <div class="glass props t-panel">
    <label class="sl"><span>Opacity</span><input type="range" id="t-op" min="5" max="100" value="50"></label>
    <label class="sl"><span>Size</span><input type="range" id="t-scale" min="10" max="150" value="60"></label>
    <p class="t-hint">Drag to position, then lock it while you trace.</p>
  </div>
  <input type="file" id="t-file" accept="image/*" hidden>
</section>

<!-- THEMES -->
<section id="themes" class="screen">
  <header class="glass top">
    <button class="ib" data-go="home" aria-label="Home"><svg class="icon"><use href="#i-back"/></svg></button>
    <span class="title">Themes</span>
    <span style="width:40px"></span>
  </header>
  <div class="scroll gal-scroll">
    <div class="themes">
      <button class="theme-card" data-theme="burgundy" style="background:linear-gradient(160deg,#3D0F1D,#651C32)"><span class="theme-name">Burgundy</span></button>
      <button class="theme-card" data-theme="ivory" style="background:linear-gradient(160deg,#FBF8F3,#E4D6D9)"><span class="theme-name">Ivory</span></button>
      <button class="theme-card" data-theme="blush" style="background:linear-gradient(160deg,#FBEFF3,#E8BCC9)"><span class="theme-name">Blush</span></button>
      <button class="theme-card" data-theme="midnight" style="background:linear-gradient(160deg,#0B1020,#2B3A67)"><span class="theme-name">Midnight</span></button>
      <button class="theme-card" data-theme="forest" style="background:linear-gradient(160deg,#0F2A1F,#1F5A43)"><span class="theme-name">Forest</span></button>
      <button class="theme-card" data-theme="graphite" style="background:linear-gradient(160deg,#161616,#3A3A3A)"><span class="theme-name">Graphite</span></button>
    </div>
  </div>
</section>

<!-- GALLERY -->
<section id="gallery" class="screen">
  <header class="glass top">
    <button class="ib" data-go="home" aria-label="Home"><svg class="icon"><use href="#i-back"/></svg></button>
    <span class="title">Gallery</span>
    <span style="width:40px"></span>
  </header>
  <div class="scroll gal-scroll">
    <div class="gal" id="gal"></div>
  </div>
  <nav class="glass dock">
    <button data-go="home" aria-label="Home"><svg class="icon"><use href="#i-home"/></svg></button>
    <button data-go="studio" aria-label="Studio"><svg class="icon"><use href="#i-studio"/></svg></button>
    <button data-go="gallery" class="on" aria-label="Gallery"><svg class="icon"><use href="#i-gallery"/></svg></button>
  </nav>
</section>

<div id="viewer" class="viewer" hidden>
  <img alt="">
  <div class="viewer-acts">
    <button class="glass pill" id="v-close"><svg class="icon"><use href="#i-close"/></svg> Close</button>
    <a class="glass pill" id="v-dl" download="drawing.jpg">Download</a>
    <button class="pill danger" id="v-del"><svg class="icon"><use href="#i-trash"/></svg> Delete</button>
  </div>
</div>

<div id="toast" class="glass toast"></div>

<script src="js/app.js"></script>
<script src="js/engine.js"></script>
<script src="js/studio.js"></script><script src="js/trace.js"></script>

</body>
                             </html>
