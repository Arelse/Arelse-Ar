<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR Drawing Studio</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/glass.css">
<link rel="stylesheet" href="css/toolbar.css">
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<img id="reference" alt="" hidden>
<div id="grid" hidden></div>
<canvas id="drawing"></canvas>

<header class="glass topbar">
  <span class="brand">AR Drawing Studio</span>
  <button id="btn-start" class="pill">Start camera</button>
</header>

<nav class="glass toolbar" aria-label="Drawing tools">
  <button class="tool active" data-tool="pen" aria-label="Pen">P</button>
  <button class="tool" data-tool="eraser" aria-label="Eraser">E</button>
  <div class="swatches">
    <button class="swatch active" data-color="#651C32" style="background:#651C32" aria-label="Burgundy"></button>
    <button class="swatch" data-color="#3D0F1D" style="background:#3D0F1D" aria-label="Dark wine"></button>
    <button class="swatch" data-color="#FFFFFF" style="background:#FFFFFF" aria-label="White"></button>
  </div>
  <input id="size" type="range" min="1" max="24" value="4" aria-label="Brush size">
  <button id="btn-undo" class="tool" aria-label="Undo">U</button>
  <button id="btn-clear" class="tool" aria-label="Clear">X</button>
  <button id="btn-grid" class="tool" aria-label="Toggle grid">G</button>
  <label class="tool" aria-label="Load reference image">R
    <input id="ref-input" type="file" accept="image/*" hidden>
  </label>
</nav>

<script src="js/camera.js"></script>
<script src="js/canvas.js"></script>
<script src="js/app.js"></script>
</body>
</html>
